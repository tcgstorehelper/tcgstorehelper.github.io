name: Precios de Card Kingdom (cada 1 h 05 min)

# Mantiene al día app/data/ck-prices.json, la lista que lee la web.
#
# Por qué acá y no solo en el repo privado: GitHub no respeta el horario "cada hora" (en el repo privado
# corría cada 4 a 7 horas, y la web mostraba el aviso rojo de lista vieja). Este repo es público, así que los
# minutos de Actions son gratis y el trabajo puede quedarse prendido: baja la lista, espera 65 minutos, la vuelve
# a bajar... y antes de llegar al límite de 6 horas de GitHub se relanza solo. El horario de abajo es solo un
# respaldo para volver a arrancar la cadena si alguna vez se corta. Si dos corridas se pisan, "concurrency"
# deja una sola en espera.
#
# El script es una copia de scripts/ck-prices.mjs del repo privado (.github/scripts/ck-prices.mjs).

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:

concurrency:
  group: precios-ck-sitio
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bajar y publicar la lista cada 65 minutos
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          actualizar() {
            node .github/scripts/ck-prices.mjs "$RUNNER_TEMP/ck-prices.json" || { echo "::warning::No se pudo bajar la lista de Card Kingdom; se reintenta en la próxima vuelta."; return 0; }
            git pull --rebase -q origin main || true
            cp "$RUNNER_TEMP/ck-prices.json" "$RUNNER_TEMP/ck-prices-info.json" app/data/
            git add app/data/ck-prices.json app/data/ck-prices-info.json
            if git diff --cached --quiet; then echo "Sin cambios de precios."; return 0; fi
            git commit -q -m "Precios de Card Kingdom $(date -u '+%F %H:%M') UTC"
            for i in 1 2 3; do
              git push -q origin HEAD:main && return 0
              sleep 10
              git pull --rebase -q origin main
            done
            echo "::warning::No se pudo subir la lista; se reintenta en la próxima vuelta."
          }
          # 5 vueltas: 0 h, 1:05, 2:10, 3:15, 4:20. La siguiente corrida arranca a las ~5:25.
          for vuelta in 1 2 3 4 5; do
            actualizar
            sleep 3900
          done
      - name: Relanzarse para seguir la cadena
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run precios.yml --repo "$GITHUB_REPOSITORY" --ref main
