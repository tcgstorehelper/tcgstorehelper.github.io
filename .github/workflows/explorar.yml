name: explorar
on:
  push:
    branches: [claude/project-thread-9d04p5]
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          mkdir -p out
          time MAX_DAYS_PER_RUN=10 python3 -u .github/scripts/games-history.py out "$RUNNER_TEMP/t"
          time MAX_DAYS_PER_RUN=5 python3 -u .github/scripts/games-history.py out "$RUNNER_TEMP/t"
          du -sh out/pokemon out/yugioh out/tcgcsv-products.json
          ls -S -l out/yugioh | head -3
          python3 -c "import json;d=json.load(open('out/yugioh/lob.json'));print(json.dumps(d['cards'].get('en005|ultrarare'))[:1500])"
          head -c 300 out/yugioh-info.json; echo
