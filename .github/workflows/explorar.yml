name: explorar
on:
  push:
    branches: [claude/project-thread-9d04p5]
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          mkdir -p out
          time MAX_DAYS_PER_RUN=200 python3 .github/scripts/games-history.py out "$RUNNER_TEMP/t"
          du -sh out/pokemon out/yugioh; ls out/pokemon | wc -l; ls out/yugioh | wc -l
          ls -S -l out/pokemon | head -5; ls -S -l out/yugioh | head -5
          head -c 1500 out/pokemon-info.json; echo
          python3 -c "import json;d=json.load(open('out/pokemon/obsidianflames.json'));print(json.dumps(d['cards'].get('63'))[:1500])"
          python3 -c "import json;d=json.load(open('out/yugioh/lob.json'));print(json.dumps(d['cards'].get('en005|ultrarare'))[:2500])"
          tar czf - out | wc -c
          # Segunda corrida: tiene que decir que está al día
          python3 .github/scripts/games-history.py out "$RUNNER_TEMP/t"
